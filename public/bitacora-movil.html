<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CIC — Bitácoras de Guardia Móvil</title>
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c3aed' stroke-width='2'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>">
  <script>
    const isEmbeddedInIframe = (window.self !== window.top) || window.location.search.includes('embedded=1');
    if (isEmbeddedInIframe) {
      document.documentElement.classList.add('is-embedded-iframe');
      const removeMobileDock = () => {
        document.querySelectorAll('.miniapps-dock-wrapper, #miniappsDockWrapper, .dock-wrapper').forEach(el => {
          el.remove();
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeMobileDock);
      } else {
        removeMobileDock();
      }
      window.addEventListener('load', removeMobileDock);
    }
  </script>
  <style>
    /* Ocultar dock si se ejecuta embebido dentro de un iframe */
    html.is-embedded-iframe .miniapps-dock-wrapper,
    body.is-embedded-iframe .miniapps-dock-wrapper,
    html.is-embedded-iframe #miniappsDockWrapper,
    body.is-embedded-iframe #miniappsDockWrapper,
    html.is-embedded-iframe .dock-wrapper,
    body.is-embedded-iframe .dock-wrapper {
      display: none !important;
    }
    html.is-embedded-iframe .app-container,
    body.is-embedded-iframe .app-container {
      padding-bottom: 24px !important;
    }
    :root {
      --bg: #090d16;
      --card-bg: #101626;
      --card-surface: #182238;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #7c3aed;
      --accent-green: #10b981;
      --accent-blue: #2563eb;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 8px) + 72px) 12px;
    }

    .header-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 14px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
    }

    .clock-tag {
      font-size: 0.76rem;
      font-weight: 700;
      color: #c084fc;
      background: rgba(124, 58, 237, 0.15);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .template-select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--card-surface);
      border: 1px solid var(--border);
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
    }

    .form-scroll-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
    }

    .field-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .field-input, .field-select, .field-textarea {
      background: var(--card-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      color: #f8fafc;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    .field-textarea {
      min-height: 70px;
      resize: vertical;
    }

    .checklist-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .checklist-row:last-child { border-bottom: none; }

    .checklist-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: #e2e8f0;
      flex: 1;
    }

    .pill-group {
      display: flex;
      gap: 4px;
    }

    .pill-btn {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* BOTTOM DOCK */
    .dock-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 8px) + 8px);
      background: linear-gradient(180deg, rgba(9, 13, 22, 0) 0%, rgba(9, 13, 22, 0.85) 40%, rgba(9, 13, 22, 0.98) 100%);
      backdrop-filter: blur(16px);
      z-index: 100;
      pointer-events: none;
    }

    .dock-bar {
      display: flex;
      gap: 8px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 6px 12px;
      max-width: 420px;
      width: 100%;
      justify-content: space-around;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 700;
      gap: 3px;
    }

    .dock-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .dock-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .icon-cdi { background: #2563eb; }
    .icon-checador { background: #059669; }
    .icon-recorridos { background: #0284c7; }
    .icon-bitacora { background: #7c3aed; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- HEADER -->
    <div class="header-card">
      <div class="header-top">
        <div class="header-title-box">
          <span style="font-size: 1.2rem;">📋</span>
          <h1 class="header-title">Bitácoras de Guardia</h1>
        </div>
        <div class="clock-tag" id="headerClock">12:00:00</div>
      </div>

      <select class="template-select" id="templateSelect" aria-label="Seleccionar Plantilla">
        <option value="bitacora_casetas">Bitácora Casetas Operativa</option>
        <option value="bitacora_cco">Bitácora Centro de Control OS</option>
      </select>
    </div>

    <!-- FORM -->
    <form class="form-scroll-area" id="bitacoraForm" onsubmit="return false;">
      <div class="field-card">
        <label class="field-label">Caseta y Turno</label>
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px;">
          <select class="field-select" id="inputCaseta">
            <option value="Edison">Edison</option>
            <option value="Recepción Edison">Recepción Edison</option>
            <option value="Impulso">Impulso</option>
            <option value="Michelena">Michelena</option>
            <option value="Simón Bolívar">Simón Bolívar</option>
          </select>
          <select class="field-select" id="inputTurno">
            <option value="Dia">Día</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
          </select>
        </div>
      </div>

      <div class="field-card">
        <label class="field-label">Acción</label>
        <select class="field-select" id="inputAccion">
          <option value="INICIO TURNO">INICIO DE TURNO</option>
          <option value="FINALIZA TURNO">FINALIZA TURNO</option>
        </select>
      </div>

      <div class="field-card">
        <label class="field-label">Novedades Durante el Turno</label>
        <textarea class="field-textarea" id="inputNovedades" placeholder="Escribe aquí las actividades y novedades..." required></textarea>
      </div>

      <div class="field-card">
        <label class="field-label">Condiciones Operativas</label>
        <div id="checklistContainer">
          <!-- Generado dinámicamente -->
        </div>
      </div>

      <div class="field-card">
        <label class="field-label">Equipos en Consigna</label>
        <input type="text" class="field-input" id="inputConsigna" placeholder="Radios, llaves o bienes en consigna...">
      </div>

      <button type="button" class="btn-submit" id="btnSave">
        <span>💾</span>
        <span>GUARDAR BITÁCORA</span>
      </button>
    </form>
  </div>

  <!-- DOCK DE NAVEGACIÓN -->
  <div class="dock-wrapper miniapps-dock-wrapper" id="miniappsDockWrapper">
    <nav class="dock-bar miniapps-dock-bar">
      <a href="./?app=cdi" class="dock-btn dock-item-btn" id="dockBtnCdi" title="CDI">
        <div class="dock-icon icon-cdi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 12h10M12 7v10"/></svg>
        </div>
        <span>CDI</span>
      </a>

      <a href="checador-movil.html" class="dock-btn dock-item-btn" id="dockBtnChecador" title="Checador">
        <div class="dock-icon icon-checador">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <span>Checador</span>
      </a>

      <a href="recorrido-movil.html" class="dock-btn dock-item-btn" id="dockBtnRecorridos" title="Recorridos">
        <div class="dock-icon icon-recorridos">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
        </div>
        <span>Recorridos</span>
      </a>

      <a href="bitacora-movil.html" class="dock-btn dock-item-btn active" id="dockBtnBitacoras" title="Bitácora">
        <div class="dock-icon icon-bitacora">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <span>Bitácora</span>
      </a>
    </nav>
  </div>

  <script>
    (function() {
      // 0. Control de Permisos por Dispositivo (Defecto: Solo CDI)
      const getDeviceUuid = () => {
        let id = localStorage.getItem('regas_cdi_device_uuid');
        if (!id) {
          id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
          localStorage.setItem('regas_cdi_device_uuid', id);
        }
        return id;
      };

      let _lastFeatures = null;
      const applyFeatures = (features) => {
        if (!features || typeof features !== 'object') return;
        _lastFeatures = features;
        const normalized = {
          checador: features.checador === true,
          recorridos: features.recorridos === true,
          bitacoras: (features.bitacoras === true || features.bitacora === true)
        };
        try {
          localStorage.setItem('regas_cdi_device_features', JSON.stringify(normalized));
        } catch(e) {}

        if (normalized.bitacoras !== true) {
          // El operador revocó el permiso de Bitácora: expulsar de inmediato a CDI
          window.location.replace('./?app=cdi');
          return;
        }

        const bChecador = document.getElementById('dockBtnChecador');
        const bRecorridos = document.getElementById('dockBtnRecorridos');
        const bBitacoras = document.getElementById('dockBtnBitacoras');
        const dockWrapper = document.getElementById('miniappsDockWrapper') || document.querySelector('.dock-wrapper') || document.querySelector('.miniapps-dock-wrapper');

        if (bChecador) bChecador.style.display = normalized.checador ? '' : 'none';
        if (bRecorridos) bRecorridos.style.display = normalized.recorridos ? '' : 'none';
        if (bBitacoras) bBitacoras.style.display = 'none';

        if (dockWrapper) {
          if (window.self !== window.top) {
            dockWrapper.style.display = 'none';
          } else {
            const hasExtra = (normalized.checador || normalized.recorridos || normalized.bitacoras);
            dockWrapper.style.display = hasExtra ? '' : 'none';
          }
        }
      };

      // Control preventivo síncrono al instante de ejecución
      try {
        const rawCached = localStorage.getItem('regas_cdi_device_features');
        if (rawCached) {
          const parsed = JSON.parse(rawCached);
          if (parsed && parsed.bitacoras !== true && parsed.bitacora !== true) {
            window.location.replace('./?app=cdi');
            return;
          }
          _lastFeatures = parsed;
        } else {
          // Sin permisos registrados, expulsar a CDI
          window.location.replace('./?app=cdi');
          return;
        }
      } catch(e) {}

      // Asegurar que el DOM aplique el filtrado tan pronto exista el dock
      const ensureDockFiltered = () => {
        if (_lastFeatures) {
          applyFeatures(_lastFeatures);
        } else {
          try {
            const raw = localStorage.getItem('regas_cdi_device_features');
            if (raw) applyFeatures(JSON.parse(raw));
          } catch(e) {}
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureDockFiltered);
      } else {
        ensureDockFiltered();
      }
      window.addEventListener('load', ensureDockFiltered);

      const resolveBackendBase = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const qBackend = urlParams.get('backend') || urlParams.get('api');
        if (qBackend) return qBackend.replace(/\/+$/, '');
        const h = window.location.hostname;
        const p = window.location.port;
        if (p === '7001') return '';
        if (h === 'localhost' || h === '127.0.0.1') return 'http://127.0.0.1:7001';
        if (h.startsWith('10.') || h.startsWith('192.168.')) return `http://${h}:7001`;
        return 'https://oxosd450mlh.taile94978.ts.net';
      };

      const BACKEND_BASE = resolveBackendBase();

      // Consultar features en vivo al backend para concordancia con RegAs 3
      try {
        const myDevId = getDeviceUuid();
        fetch(`${BACKEND_BASE}/api/cdi/devices/features?deviceId=${encodeURIComponent(myDevId)}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d && d.features) {
              applyFeatures(d.features);
            }
          })
          .catch(() => {});
      } catch(e) {}

      // Conexión SSE para escuchar revocación o activación de permisos en tiempo real
      try {
        const myDevId = getDeviceUuid();
        const sseUrl = `${BACKEND_BASE}/api/events`;
        const es = new EventSource(sseUrl);
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data && data.type === 'cdi_device_update' && data.payload) {
              const p = data.payload;
              if ((p.deviceId === myDevId || p._id === myDevId) && p.features) {
                applyFeatures(p.features);
              }
            }
          } catch(err) {}
        };
      } catch(errSse) {}

      setInterval(() => {
        const el = document.getElementById('headerClock');
        if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, 1000);

      const items = [
        { key: 'llaves', label: 'Juego de llaves y accesos completos' },
        { key: 'portones', label: 'Portones funcionando al 100%' },
        { key: 'area_limpia', label: 'Área de trabajo limpia y ordenada' },
        { key: 'equipos', label: 'Equipos de trabajo funcionando' },
        { key: 'dispositivos', label: 'Dispositivos cargados (radios/celular)' }
      ];

      const conditions = {};
      const container = document.getElementById('checklistContainer');

      items.forEach(it => {
        conditions[it.key] = 'SI';
        const row = document.createElement('div');
        row.className = 'checklist-row';
        row.innerHTML = `
          <span class="checklist-text">${it.label}</span>
          <div class="pill-group" data-key="${it.key}">
            <button type="button" class="pill-btn active" data-val="SI">SI</button>
            <button type="button" class="pill-btn" data-val="NO">NO</button>
            <button type="button" class="pill-btn" data-val="N/A">N/A</button>
          </div>
        `;
        container.appendChild(row);

        row.querySelectorAll('.pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            row.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            conditions[it.key] = btn.dataset.val;
          });
        });
      });

      document.getElementById('btnSave').addEventListener('click', async () => {
        const novedades = document.getElementById('inputNovedades').value.trim();
        if (!novedades) {
          alert('Por favor ingresa las novedades del turno');
          return;
        }

        const payload = {
          schemaId: document.getElementById('templateSelect').value,
          caseta: document.getElementById('inputCaseta').value,
          turno: document.getElementById('inputTurno').value,
          accion: document.getElementById('inputAccion').value,
          fecha: new Date().toISOString().slice(0, 10),
          novedades: novedades,
          condiciones: conditions,
          consignas: document.getElementById('inputConsigna').value.trim(),
          createdAt: new Date().toISOString()
        };

        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.textContent = 'Guardando en UBE...';

        try {
          const res = await fetch(`${BACKEND_BASE}/api/bitacoras`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            alert('¡Bitácora registrada correctamente en UBE!');
            document.getElementById('inputNovedades').value = '';
          } else {
            alert('Error al guardar en el servidor');
          }
        } catch (e) {
          alert('Error de conexión con UBE: ' + e.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<span>💾</span><span>GUARDAR BITÁCORA</span>';
        }
      });
    })();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fda085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#grad1)"/>
  
  <!-- Outer Shield Contour -->
  <path d="M256 70 C340 70 410 110 410 170 C410 320 256 430 256 442 C256 430 102 320 102 170 C102 110 172 70 256 70 Z" 
        fill="none" stroke="url(#gold)" stroke-width="14" filter="url(#shadow)"/>
        
  <!-- Inner Shield Fill -->
  <path d="M256 95 C325 95 385 130 385 180 C385 305 256 400 256 410 C256 400 127 305 127 180 C127 130 187 95 256 95 Z" 
        fill="#142834" opacity="0.85"/>
        
  <!-- Checkmark / Security emblem -->
  <path d="M200 250 L240 290 L320 195" fill="none" stroke="#00e676" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text 'RegAs 3' -->
  <text x="256" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    RegAs 3
  </text>
  <text x="256" y="392" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#00e676" text-anchor="middle" letter-spacing="4">
    SEGURIDAD &bull; OS
  </text>
</svg>
